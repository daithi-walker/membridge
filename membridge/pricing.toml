# Haiku 5.5 is priced by prompt length: a call whose prompt (input + cache reads +
# cache writes) exceeds the threshold pays the long_context rates for the whole call.
[models."claude-haiku-5-5"]
input = 0.10
output = 0.50
cache_read = 0.01
cache_write_5m = 0.125
cache_write_1h = 0.20
long_context_threshold = 100000

[models."claude-haiku-5-5".long_context]
input = 0.50
output = 2.50
cache_read = 0.05
cache_write_5m = 0.625
cache_write_1h = 1.0

