# Claude list prices used to estimate session cost from transcript token usage.
#
# Units: USD per million tokens (web search: USD per request).
# Source: https://platform.claude.com/docs/en/about-claude/pricing (fetched 2026-10-20).
# Vertex AI `global` endpoint rates were checked against a GCP billing export on the
# same day and match these list prices exactly (regional Vertex endpoints cost ~10%
# more; not modelled).
#
# After editing, restart the server and re-run scripts/backfill_usage.py to reprice.

web_search_per_request = 0.01

# fast_input / fast_output: fast-mode rates (first-party API only). Cache rates scale
# by the same factor as input, since caching multipliers stack on top of fast mode.

[models."claude-fable-5-1"]
input = 10.0
output = 50.0
cache_read = 0.25
cache_write_5m = 12.5
cache_write_1h = 20.0

[models."claude-fable-5"]
input = 10.0
output = 50.0
cache_read = 1.0
cache_write_5m = 12.5
cache_write_1h = 20.0

